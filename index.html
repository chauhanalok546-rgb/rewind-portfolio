<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rewind: avatar test</title>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div class="vignette"></div>
    <div class="hud">
      <div class="panel">
        <b>Avatar test</b>
        <span id="status">loading avatar…</span>
        <div class="row">
          <button id="speak" disabled>Speak test line</button>
          <button id="frame" disabled>Head / full body</button>
          <button id="blink" disabled>Blink</button>
          <button id="theme">Lab theme</button>
        </div>
        <div class="row">
          <button id="ex-neutral">Neutral</button>
          <button id="ex-happy">Happy</button>
          <button id="ex-serious">Serious</button>
          <button id="ex-proud">Proud</button>
        </div>
        <div class="row" id="gestures"></div>
        <small>Move the mouse: eyes and head follow. Idle breathing and random blinks are always on.</small>
      </div>
    </div>
    <div id="sub" class="sub"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
